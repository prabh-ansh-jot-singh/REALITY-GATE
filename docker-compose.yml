services:
  reality-gate:
    build: .
    container_name: reality-gate-v2
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - REALITY_GATE_HOST=0.0.0.0
      - REALITY_GATE_PORT=8000
      - REALITY_GATE_DB_PATH=/app/data/reality_gate.db
      - REALITY_GATE_AUDIT_PATH=/app/logs/audit.jsonl
    volumes:
      - reality_gate_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  reality_gate_data:
